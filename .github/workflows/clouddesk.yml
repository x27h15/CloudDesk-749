# CloudDesk canonical workflow v4
name: CloudDesk
run-name: "CloudDesk session: ${{ inputs.session_id }}"

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "CloudDesk session identifier"
        required: true
        type: string
      backend_url:
        description: "CloudDesk backend URL"
        required: false
        type: string
        default: ""

jobs:
  clouddesk:
    name: "CloudDesk macOS Session"
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      id-token: write
    steps:
      - name: Environment Diagnostics
        run: |
          echo "=== System & Kernel ==="
          uname -a
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Architecture ==="
          uname -m
          echo "=== Runner Variables ==="
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "GitHub Repository: ${{ github.repository }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Session ID: ${{ inputs.session_id }}"

      - name: Run CloudDesk Native Bootstrap
        run: |
          echo "=== Requesting OIDC Token ==="
          AUDIENCE="https://api.cloud-desk.dev"
          
          OIDC_RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${AUDIENCE}")
          OIDC_TOKEN=$(echo "$OIDC_RESP" | jq -r '.value // empty')
          
          if [ -z "$OIDC_TOKEN" ]; then
            echo "ERROR: Failed to retrieve OIDC token from GitHub"
            exit 1
          fi
          echo "GitHub OIDC token obtained successfully."
          
          BACKEND_URL="${{ inputs.backend_url }}"
          if [ -n "$BACKEND_URL" ]; then
            echo "=== Exchanging OIDC Token with CloudDesk Backend ==="
            EXCHANGE_PAYLOAD=$(jq -n --arg tok "$OIDC_TOKEN" '{"oidc_token": $tok}')
            EXCHANGE_RESP=$(curl -sS -X POST "${BACKEND_URL}/api/v1/github/oidc/exchange"               -H "Content-Type: application/json"               -d "$EXCHANGE_PAYLOAD")
            
            CREDENTIAL=$(echo "$EXCHANGE_RESP" | jq -r '.credential // empty')
            EXPIRES_IN=$(echo "$EXCHANGE_RESP" | jq -r '.expires_in // empty')
            RESP_SESSION=$(echo "$EXCHANGE_RESP" | jq -r '.session_id // empty')
            
            if [ -z "$CREDENTIAL" ]; then
              echo "ERROR: Failed to obtain session credential"
              echo "Response: $(echo "$EXCHANGE_RESP" | jq -c '.')"
              exit 1
            fi
            
            echo "OIDC exchange: SUCCESS"
            echo "Credential: issued"
            echo "Credential TTL: ${EXPIRES_IN}s"
            
            echo "=== Fetching Native Bootstrap Artifact ==="
            META_RESP=$(curl -sS "${BACKEND_URL}/api/v1/bootstrap/artifact?platform=macos&arch=arm64")
            EXPECTED_SHA=$(echo "$META_RESP" | jq -r '.sha256 // empty')
            
            if [ -z "$EXPECTED_SHA" ]; then
              echo "ERROR: Failed to fetch bootstrap artifact metadata"
              exit 1
            fi
            echo "Expected Bootstrap SHA-256: ${EXPECTED_SHA}"
            
            echo "Downloading Native Bootstrap binary..."
            curl -sS "${BACKEND_URL}/api/v1/bootstrap/download?platform=macos&arch=arm64" -o clouddesk-bootstrap
            chmod +x clouddesk-bootstrap
            
            echo "Verifying SHA-256 integrity..."
            ACTUAL_SHA=$(shasum -a 256 clouddesk-bootstrap | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: Bootstrap SHA-256 mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi
            echo "Integrity verification: SUCCESS"
            
            echo "=== Executing Native Bootstrap ==="
            # Pass credential via stdin (never via CLI arguments or files)
            echo -n "$CREDENTIAL" | ./clouddesk-bootstrap               --backend-url "${BACKEND_URL}"               --session-id "${{ inputs.session_id }}"
            BOOTSTRAP_EXIT=$?
            
            if [ $BOOTSTRAP_EXIT -eq 0 ]; then
              echo "Native Bootstrap execution: SUCCESS"
            else
              echo "ERROR: Native Bootstrap failed with exit code ${BOOTSTRAP_EXIT}"
              exit 1
            fi
          else
            echo "No backend_url specified; verified OIDC token generation."
          fi
